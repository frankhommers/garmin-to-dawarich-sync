name: Build branch image to GHCR

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: true
        default: 'main'
      tag:
        description: 'GHCR image tag to publish'
        required: true
        default: 'manual'
  push:
    branches: [main]

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Derive image metadata
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # GHCR/Docker tags cannot contain slashes or arbitrary punctuation.
          safe_tag=$(echo "$tag" | tr '[:upper:]' '[:lower:]' | sed -E 's|[^a-z0-9._-]+|-|g; s|^-+||; s|-+$||')
          [ -n "$safe_tag" ] || safe_tag="manual"
          echo "IMAGE_NAME=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$safe_tag" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$image:$safe_tag" >> "$GITHUB_ENV"
          echo "Building $image:$safe_tag from ${{ github.event.inputs.ref || github.ref_name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Published $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
